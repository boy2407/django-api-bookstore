
{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register</title>
{% load static %}
    <!-- Font Icon -->
    <link rel="stylesheet" type="text/css"  href="{% static '/assets/fonts/material-icon/css/material-design-iconic-font.css' %}">
    <!-- Main css -->
    <link rel="stylesheet" type="text/css"  href="{% static '/assets/css/css_Login/style.css' %}">
</head>
<body>
    <section class="container">
        <div class="noti-password text-center">
        <h3 class="noti-title"> <strong> ĐẶT LẠI MẬT KHẨU </strong> </h3>
            <br>
            <p>Quên mật khẩu của bạn? Nhập địa chỉ email của bạn bên dưới và chúng tôi sẽ gửi email hướng dẫn cách thiết lập địa chỉ mới</p>
            <form method="post">
                {% csrf_token %}
                {{form|crispy}}
                <br>
                <button type="submit" class="btn btn-primary navbar-btn text-white w-100 p-2"> Đặt lại mật khẩu</button>
            </form>
    </div>
    </section>
</body>
<script src="{% static '/assets/vendor/jquery/jquery.min.js' %}" type="text/javascript"></script>
    <script src="{% static '/assets/js/js_login/main.js' %}" type="text/javascript"></script>
</html>
