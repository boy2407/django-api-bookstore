<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login</title>
    {% load static %}
    {% load crispy_forms_tags %}
    <!-- Font Icon -->
    <link rel="stylesheet" type="text/css"
          href="{% static '/assets/fonts/material-icon/css/material-design-iconic-font.css' %}">
    <!-- Main css -->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/css_Login/style.css' %}">
    <link rel="stylesheet" href="{% static '/assets/css/css_Login/style.css' %}">
</head>

<body>
<div class="main">

<section class="sign-in">
    <div class="container">
        <div class="signin-content">
            <div class="signin-image">
                <figure><img src="{% static '/assets/images/login_register/signin-image.jpg' %}" alt="sing up image">
                </figure>
            </div>
            <div class="signin-form">
                <h2 class="form-title">Sign up</h2>
                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <p {% if message.tags %} class="{{ message.tags }}" {% endif %}> {{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}

                <form action="{% url 'login' %}" method="POST" class="auth-validate-form">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="your_name"><i class="zmdi zmdi-account material-icons-name"></i></label>
                        <input type="text" name="username" id="your_name" placeholder="Your Name"/>
                    </div>
                    <div class="form-group">
                        <label for="your_pass"><i class="zmdi zmdi-lock"></i></label>
                        <input type="password" name="password" id="your_pass" placeholder="Password"/>
                    </div>
                    <div class="form-group">
                        <input type="checkbox" name="remember-me" id="remember-me" class="agree-term"/>
                        <label for="remember-me" class="label-agree-term"><span><span></span></span>Remember me</label>
                    </div>
                    <div class="form-group form-button">
                        <input type="submit" name="signin" id="signin" class="form-submit" value="Log in"/>
                    </div>

                    <a href="{% url 'register' %}" class="signup-image-link">Create an account</a>
                    <a href="{% url 'reset_password' %}" class="signup-image-link"> Forgotten your password? </a>
                </form>
            </div>
        </div>
    </div>
</section>
</div>

</body>

<!-- JS -->
<script src="{% static '/assets/vendor/jquery/jquery.min.js' %}" type="text/javascript"></script>
<script src="{% static '/assets/js/js_login/main.js' %}" type="text/javascript"></script>
</body>
</html>
