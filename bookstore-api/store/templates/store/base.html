<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHÀ SÁCH MIỀN TÂY</title>
    {% load static %}
    <!-- Links css style -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="{% static '/assets/bootstrap_5.3.2/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <link rel="stylesheet" href="{% static '/assets/css/index.css' %}">
    {% block links %}
    {% endblock %}
</head>
<body class="main-bg" onload="index()">

{% include 'store/bin/header.html' %}

{% block container %}
{% endblock %}


<!-- Links script -->
<script src="https://kit.fontawesome.com/16707960cf.js" crossorigin="anonymous"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> <script src="../assets/js/handle.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
        crossorigin="anonymous"></script>

<script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
<script src="{% static '/assets/bootstrap_5.3.2/js/bootstrap.bundle.min.js' %} "></script>
<script src="{% static '/assets/bootstrap_5.3.2/js/bootstrap.min.js' %}"></script>
<script src="{% static '/assets/bootstrap_5.3.2/js/popper.min.js' %}"></script>
<script src="{% static '/assets/js/index-handle.js' %}"></script>
{% block scripts %}

{% endblock %}
<script>

    $(document).ready(function () {

        $('.buybtn').click(function () {
            var url = $(this).data('url');
            window.location.href = url;
        });

        //Add product to cart
        $('body').on('click', '.btnAddToCart', function (e) {
            e.preventDefault();
            var id = $(this).data('id');
            var quantity = 1;
            var tQuantity = $('#quantity_value').val();
            if (tQuantity !== undefined && tQuantity != '') {
                quantity = parseInt(tQuantity);
            }

            $.ajaxSetup({
                headers: {"X-CSRFToken": '{{ csrf_token }}'}
            });

            $.ajax({
                type: 'POST',
                url: "{% url 'cart-add' %}",
                data: {id: id, quantity: quantity},

                success: function (rs) {
                    if (rs.Success) {
                        alert(rs.msg);
                        totalCart()
                    } else {
                        alert(rs.msg);
                    }
                }
            })
        });

        function totalCart() {
            $.ajax({
                url: "{% url 'totalcart' %}",
                success: function (data) {
                    $("#gettotalcart").html(data);
                    console.log(data)
                }
            })
        }
    });
</script>


</body>
<footer>
    <hr>
    <p class="text-center fixed-bottom ">TIỆM SÁCH MIỀN TÂY - CHUYÊN BÁN SÁCH SĨ LẺ</p>
</footer>
</html>
